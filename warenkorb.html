<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warenkorb — Signorina.collection</title>
<meta name="description" content="Dein Warenkorb bei Signorina.collection.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F9EAEC">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F9EAEC'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' fill='%23C9A24A' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css?v=9">
</head>

<body>

<div id="site-header"></div>

<main>
  <div class="wrap">
    <nav class="crumbs" aria-label="Brotkrumen">
      <a href="index.html">Startseite</a>
      <span class="sep">/</span>
      <span aria-current="page">Warenkorb</span>
    </nav>

    <h1 style="font-size:clamp(2rem,4vw,3rem);margin-bottom:.4rem">Warenkorb</h1>
    <hr class="rule rule-left">

    <div id="cart-root" style="margin:2rem 0 clamp(3.5rem,7vw,6rem)"></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/art.js?v=9"></script>
<script src="assets/shop.js?v=9"></script>
<script>
Shop.mountChrome({ active: null });

var root = document.getElementById('cart-root');

function euro(n) { return Shop.money(n); }

function render() {
  var t = Shop.totals();

  if (!t.lines.length) {
    root.innerHTML =
      '<div class="empty-state">' +
        '<svg viewBox="0 0 24 24"><path d="M6 7h12l1.4 13H4.6L6 7Z"/><path d="M9 7V5.5a3 3 0 0 1 6 0V7"/></svg>' +
        '<h2>Dein Warenkorb ist noch leer</h2>' +
        '<p>Vielleicht ist in den Neuheiten etwas dabei.</p>' +
        '<a href="kategorie.html?c=neu" class="btn btn-gold">Kollektion ansehen</a>' +
      '</div>';
    return;
  }

  var lines = t.lines.map(function (x) {
    var key = Shop.lineKey(x.line.id, x.line.color, x.line.size);
    return '' +
      '<article class="cart-line">' +
        '<a href="produkt.html?id=' + x.product.id + '">' +
          Shop.phMarkup(x.line.color, '', null, x.product) +
        '</a>' +
        '<div>' +
          '<h3><a href="produkt.html?id=' + x.product.id + '">' + x.product.name + '</a></h3>' +
          '<p class="variant">' + x.line.color + ' · Größe ' + x.line.size + '</p>' +
          '<div class="line-actions">' +
            '<div class="qty">' +
              '<button type="button" data-dec="' + key + '" aria-label="Menge verringern">&minus;</button>' +
              '<output>' + x.line.qty + '</output>' +
              '<button type="button" data-inc="' + key + '" aria-label="Menge erhöhen">+</button>' +
            '</div>' +
            '<button class="link-plain" data-del="' + key + '">Entfernen</button>' +
          '</div>' +
        '</div>' +
        '<p class="line-sum">' + euro(x.sum) +
          '<span class="unit">' + x.line.qty + ' × ' + euro(x.product.price) + '</span>' +
        '</p>' +
      '</article>';
  }).join('');

  var freeHint = t.missingForFree > 0
    ? '<div class="free-hint">Noch <b>' + euro(t.missingForFree) + '</b> bis zum kostenlosen Versand.' +
      '<span class="free-bar"><i style="width:' +
        Math.min(100, (t.subtotal / Shop.FREE_SHIPPING_FROM) * 100).toFixed(0) + '%"></i></span></div>'
    : '<div class="free-hint">Versand ist <b>kostenlos</b> — Bestellwert über ' +
      euro(Shop.FREE_SHIPPING_FROM) + '.</div>';

  root.innerHTML =
    '<div class="cart-layout">' +
      '<div>' + lines +
        '<p style="margin-top:1.6rem">' +
          '<a href="kategorie.html?c=neu" class="link-plain">&larr; Weiter einkaufen</a></p>' +
      '</div>' +
      '<aside class="summary">' +
        '<h2>Zusammenfassung</h2>' +
        freeHint +
        '<div class="sum-row"><span>Zwischensumme</span><span>' + euro(t.subtotal) + '</span></div>' +
        '<div class="sum-row"><span>Versand</span><span>' +
          (t.shipping === 0 ? 'kostenlos' : euro(t.shipping)) + '</span></div>' +
        '<div class="sum-row total"><span>Gesamt</span><span>' + euro(t.total) + '</span></div>' +
        '<p class="sum-note">inkl. ' + euro(t.vat) + ' MwSt. (19 %)</p>' +
        '<a href="kasse.html" class="btn btn-gold btn-block" style="margin-top:1.4rem">Zur Kasse</a>' +
        '<p class="sum-note" style="text-align:center;margin-top:.9rem">' +
          'Zahlung mit PayPal, Klarna, Kreditkarte oder SEPA</p>' +
      '</aside>' +
    '</div>';
}

root.addEventListener('click', function (e) {
  var inc = e.target.closest('[data-inc]');
  var dec = e.target.closest('[data-dec]');
  var del = e.target.closest('[data-del]');
  if (!inc && !dec && !del) return;

  var items = Shop.cartItems();
  function qtyOf(key) {
    for (var i = 0; i < items.length; i++) {
      if (Shop.lineKey(items[i].id, items[i].color, items[i].size) === key) return items[i].qty;
    }
    return 1;
  }

  if (inc) Shop.setQty(inc.dataset.inc, qtyOf(inc.dataset.inc) + 1);
  if (dec) Shop.setQty(dec.dataset.dec, qtyOf(dec.dataset.dec) - 1);
  if (del) { Shop.removeLine(del.dataset.del); Shop.toast('Artikel entfernt'); }
  render();
});

render();
</script>

</body>
</html>
